<!DOCTYPE html>
<html>
<head>
<title>Student Registration Form</title>

<style>
    body{
        background-color: blueviolet;
        color: white;
        font-family: Arial;
    }

    .container{
        width: 60%;
        margin: auto;
        padding: 20px;
        background-color: blueviolet;
    }

    table{
        width: 100%;
        border-collapse: collapse;
    }

    td, th{
        padding: 8px;
        border: 1px;   /* remove all borders */
    }

    h2{
        text-align: center;
    }

    /* Only qualification table has border */
    .inner-table td, .inner-table th{
        border: 1px solid white;
    }
</style>
</head>

<body>

<div class="container">

<h2>Student Registration Form</h2>

<form>
<table>

<tr>
<td>First Name</td>
<td><input type="text"></td>
</tr>

<tr>
<td>Last Name</td>
<td><input type="text"></td>
</tr>

<tr>
<td>Date of Birth</td>
<td><input type="date"></td>
</tr>

<tr>
<td>Email</td>
<td><input type="email"></td>
</tr>

<tr>
<td>Mobile No</td>
<td><input type="number"></td>
</tr>

<tr>
<td>Gender</td>
<td>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
</td>
</tr>

<tr>
<td>Address</td>
<td><input type="text"></td>
</tr>

<tr>
<td>City</td>
<td><input type="text"></td>
</tr>

<tr>
<td>Pin Code</td>
<td><input type="number"></td>
</tr>

<tr>
<td>State</td>
<td><input type="text"></td>
</tr>

<tr>
<td>Country</td>
<td>
<select>
<option>India</option>
<option>US</option>
<option>UK</option>
</select>
</td>
</tr>

<tr>
<td>Hobbies</td>
<td>
<input type="checkbox"> Reading
<input type="checkbox"> Writing
<input type="checkbox"> Drawing
<input type="checkbox"> Painting
</td>
</tr>

<!-- Qualification section -->
<tr>
<td colspan="2">

<table class="inner-table">
<tr>
<th>Examination</th>
<th>Board</th>
<th>Percentage</th>
<th>Year</th>
</tr>

<tr>
<td>10th</td>
<td><input type="text"></td>
<td><input type="number"></td>
<td><input type="number"></td>
</tr>

<tr>
<td>12th</td>
<td><input type="text"></td>
<td><input type="number"></td>
<td><input type="number"></td>
</tr>

</table>

</td>
</tr>

<tr>
<td>Course</td>
<td>
<input type="radio" name="course"> BCA
<input type="radio" name="course"> BCOM
</td>
</tr>

<tr>
<td colspan="2" align="center">
<input type="submit" value="Submit">
<input type="reset" value="Reset">
</td>
</tr>

</table>
</form>

</div>

</body>
</html>
