<!DOCTYPE html>
<html>
    <head>
        <title>student registration form</title>
        <style>
            body{
                background-color: blueviolet;
                color:aliceblue;
            }

            table{
                background-color: blueviolet;
                color: aliceblue;
            }
        </style>
    </head>
    <body>
        <h2>student form</h2>
        <form>
        <table border="1" align="center" cellpadding="8">
            <tr>
                <td>first name</td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td>last name</td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td>date of birth</td>
                <td><input type="date"></td>
            </tr>

            <tr>
                <td>email id</td>
                <td><input type="email"></td>
            </tr>

            <tr>
                <td>mobile no</td>
                <td><input type="number"></td>
            </tr>

            <tr>
                <td>gender</td>
                <td>
                    <input type="radio" name ="gender">male
                    <input type="radio" name ="gender">female 
                </td>
            </tr>

            <tr>
                <td>address</td>
                <td>input type="text"</td>
            </tr>

            <tr>
                <td>city</td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td>pin code</td>
                <td><input type="number"></td>
            </tr>

            <tr>
                <td>state</td>
                <td>input type="text"</td>
            </tr>

            <tr>
                <td>country</td>
                <td>
                    <select>
                        <option>india</option>
                        <option>us</option>
                        <option>uk</option>
                    </select>
                </td>
            </tr>
             
            <tr>
                <td>hobbies</td>
                <td>
                    <input type="checkbox">reading
                    <input type="checkbox">writing
                    <input type="checkbox">Drawing
                    <input type="checkbox">painting
                </td>
            </tr>

            <tr>Qualification</tr>
            <table border="1" align ="center" cellpadding="5">
                <tr>
                    <th>examination</th>
                    <th>board</th>
                    <th>Percentage</th>
                    <th>year of passing</th>
                </tr>
                <tr>
                    <td>10th</td>
                    <td><input type="text"></td>
                    <td><input type="number"></td>
                    <td><input type="number"></td>
                </tr>

                <tr>
                    <td>12th</td>
                    <td><input type="text"></td>
                    <td><input type="number"></td>
                    <td><input type="number"></td>
                </tr>

            </table>

                <tr>course applied for</tr>
                <td><input type="radio">b.ca</td>
                <td><input type="radio">b.com</td>
                <br><br>

                <tr>
                    <td align="center">
                    <input type="submit" value="submit">
                    <input type="reset" value="reset">

                    </td>

                </tr>
                

            

        </table>
        </form>
    </body>
</html>
