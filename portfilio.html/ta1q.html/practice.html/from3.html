<!DOCTYPE html>
<html>
<head>
<title>Styled Form</title>
<style>
/* Style text and email inputs */
input[type="text"], input[type="email"]{
border: 2px solid blue;
padding: 5px;
margin: 5px;
}
/* Style dropdown */
select{
border: 2px solid green;
padding: 5px;
margin: 5px;
}
/* Style radio buttons (increase size) */
input[type="radio"]{
width: 20px;
height: 20px;
/* Style checked checkbox */
input[type="checkbox"]:checked{
accent-color: red;
}
}
/* Style submit button */
input[type="submit"]{
background-color: orange;
color: white;
padding: 8px 15px;
border: none;
cursor: pointer;
}
</style>
</head>
