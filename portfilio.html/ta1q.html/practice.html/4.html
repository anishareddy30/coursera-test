<!Doctype html>
<html>
    <head>
        <title>
            form
        </title>
        <style>
            input[type="text"] , input[type="email"]{
                border : 2px solid green;
                padding : 5px;
                margin : 5px;
            }

            input[type="radio"]{
                width : 20px;
                height : 20px;
            }

            select{
                border : 2px solid green;
                padding : 5px;
                margin : 5px;
            }

            input[type="submit"]{
                background-color: orange;
                color:white;

            }

            input[type="checkbox"]:checked{
                accent-color: red;
            }



            
        </style>
    </head>
    <body>
        <form>
        name:
        <input type="text" placeholder="enter your name"><br><br>
        email:
        <input type="email" placeholder="enter your text"><br><br>
        gender:
        <input type="radio" name="gender" >Male
        <input type="radio" name="gender" >female
        country:
        <select>
        <option>india</option>
        <option>us</option>
        </select>
        subscribe :
        <input type="checkbox">i agree
        <br><br>
        <input type="submit" value="submit">
        </form>
    </body>
</html>
